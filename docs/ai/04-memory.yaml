lessons_preserved:

  - rule: "Never modify data/type files without updating loader/validator"
    reason: "Data files and type files are coupled to loader.ts Zod schemas; breaking this causes validateData() to throw at startup"

  - rule: "Override setters auto-recalculate"
    reason: "setRawInputOverride, removeRawInputOverride, setRecipeOverride, removeRecipeOverride all call calculate() after state update. Do not manually call calculate() after these."

  - rule: "Manual materials capped inline, excluded from cap checks"
    reason: "Items with raw input overrides are capped at the override rate in the solver and excluded from checkRawMaterialCaps() to avoid double-counting"

  - rule: "setPatch clears goals; setActiveRegion resets everything"
    reason: "Switching patches clears all production goals (prevents cross-patch contamination). Switching regions auto-unlocks core sites and clears goals/nodes/transfers."

  - rule: "selectRecipe uses O(1) producibleItems lookup"
    reason: "Do not change computeProducibleItems() iteration logic without verifying the O(1) contract in selectRecipe()"

  - rule: "visitedItems.delete() after recursion is intentional"
    reason: "Allows the same item to appear in multiple solution branches. Do not remove this delete call."

